<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head> <body>
<div class="container-fluid vh-100 p-0">
    <div class="row g-0 h-100">

        <!-- LADO ESQUERDO: A Box Verde -->
        <div
            class="col-md-6 bg-success text-white d-flex flex-column justify-content-center align-items-center text-center p-4">
            <h2 class="fw-bold">VetClinica</h2>

            <p class="mt-3" style="max-width: 350px;">
                O melhor atendimento veterinário para o seu companheiro.
            </p>
        </div>

        <!-- LADO DIREITO: Formulário de Login -->
        <div class="col-md-6 d-flex flex-column justify-content-center align-items-center p-4 bg-white">

            <form action="{{ url_for('login.receber_dados') }}" method="POST" class="w-100"
                style="max-width: 350px;">

                <h3 class="text-center fw-bold mb-4 text-success">
                    Bem-vindo(a)!
                </h3>

                <!-- Campo Usuário -->
                <div class="mb-3">
                    <label for="usuarioLogin" class="form-label fw-semibold text-muted">
                        Email ou ID cadastrado
                    </label>

                    <input type="text"
                        class="form-control"
                        id="nomeLogin"
                        name="nomeLogin"
                        placeholder="Digite seu usuário"
                        required>
                </div>

                <!-- Campo Senha -->
                <div class="mb-4">
                    <label for="senhaLogin" class="form-label fw-semibold text-muted">
                        Senha
                    </label>

                    <input type="password"
                        class="form-control"
                        id="senhaLogin"
                        name="senhaLogin"
                        placeholder="Digite sua senha"
                        required>
                </div>

                <!-- Botão de Enviar -->
                <div class="d-grid">
                    <button type="submit"
                        class="btn btn-success rounded-pill py-2 fw-semibold">
                        Enviar
                    </button>
                </div>

                <!-- Link para cadastro -->
                <div class="text-center mt-3">
                    <small class="text-muted">
                        Ainda não possui um login?
                    </small>

                    <a href="{{ url_for('cadastroConta') }}"
                        class="text-success fw-semibold text-decoration-none ms-1">
                        Cadastre-se!
                    </a>
                </div>

            </form>

        </div>

    </div>
</div>

</body> </html>
