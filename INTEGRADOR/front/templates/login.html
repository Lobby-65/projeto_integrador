<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>
    <div class="container-fluid vh-100 p-0">
        <div class="row g-0 h-100">

            <!-- LADO ESQUERDO: A Box Verde -->
            <div
                class="col-md-6 bg-success text-white d-flex flex-column justify-content-center align-items-center text-center p-4">
                <h2 class="fw-bold">VetClinica</h2>

                <p class="mt-3" style="max-width: 350px;">
                    O melhor atendimento veterinário para o seu companheiro, com a facilidade que você merece. Agende
                    agora!
                </p>
            </div>

            <!-- LADO DIREITO: Formulário de Login -->
            <div class="col-md-6 d-flex flex-column justify-content-center align-items-center p-4 bg-white">

                <!-- linha da tag <form> aponta diretamente para a rota /login do seu main.py: -->
                <form action="{{ url_for('login') }}" method="POST" class="w-100" style="max-width: 350px;">

                    <h3 class="text-center fw-bold mb-4">
                        Bem Vindo (a)!
                    </h3>

                    <!-- AQUI VAI APARECER A MENSAGEM DE ERRO (EMAIL OU SENHA ERRADOS) -->
                    {% if erro %}
                    <div class="alert alert-danger text-center p-2 mb-3" role="alert" style="font-size: 0.9rem;">
                        {{ erro }}
                    </div>
                    {% endif %}
                    <!-- FIM DA MENSAGEM DE ERRO -->

                    <!-- Campo Usuário -->
                    <div class="mb-3">
                        <!-- Campo Usuário -->
                        <div class="mb-3">
                            <label for="emailLogin" class="form-label fw-semibold text-muted">
                                Email cadastrado
                            </label>

                            <input type="text" class="form-control" id="emailLogin" name="emailLogin"
                                placeholder="Email" required>
                        </div>

                        <!-- Campo Senha -->
                        <div class="mb-2">
                            <label for="senhaLogin" class="form-label fw-semibold text-muted">
                                Senha
                            </label>

                            <div class="password-wrapper">
                                <input type="password" class="form-control" id="senhaLogin" name="senhaLogin"
                                    placeholder="Sua Senha" required>
                                <i class="bi bi-eye password-toggle" id="toggleSenha"></i>
                            </div>
                        </div>

                        <!-- Esqueci minha senha -->
                        <div class="text-end mb-4">
                            <a href="#" class="text-decoration-none small text-dark">
                                Esqueci minha Senha
                            </a>
                        </div>

                        <!-- Botão Criar Conta -->
                        <div class="d-grid mb-3">
                            <a href="{{ url_for('cadastroConta') }}" class="btn btn-outline-secondary-pill py-2">
                                Criar Conta
                            </a>
                        </div>

                        <!-- Separador "Ou" -->
                        <div class="text-center mb-3">
                            Ou
                        </div>

                        <!-- Botão Entrar pelo Google -->
                        <div class="d-grid">
                            <a href="{{ url_for('login') }}" class="btn btn-outline-success rounded px-4 fw-semibold">
                                Entrar pelo google
                            </a>
                        </div>

                        <!-- Botão de Enviar (login normal) -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-outline-secondary-pill py-2">
                                Entrar
                            </button>
                        </div>

                </form>

            </div>

        </div>
    </div>

    <script>
        const toggleSenha = document.getElementById('toggleSenha');
        const senhaInput = document.getElementById('senhaLogin');

        toggleSenha.addEventListener('click', function () {
            const tipo = senhaInput.getAttribute('type') === 'password' ? 'text' : 'password';
            senhaInput.setAttribute('type', tipo);
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
        });
    </script>

</body>

</html>
